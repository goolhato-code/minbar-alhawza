<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>منبر الحوزة</title>

<style>

body{
margin:0;
font-family:Tahoma;
background:linear-gradient(135deg,#020617,#0f172a,#020617);
color:white;
text-align:center;
overflow-x:hidden;
}

header{
padding:60px 20px;
animation:fade 2s;
}

@keyframes fade{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;}
}

h1{
font-size:48px;
margin-bottom:10px;
}

.subtitle{
opacity:.8;
font-size:20px;
}

.ayah{
margin:30px auto;
max-width:700px;
color:#facc15;
font-size:22px;
line-height:1.8;
}

.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border-radius:20px;
padding:40px;
width:90%;
max-width:700px;
margin:auto;
box-shadow:0 0 30px rgba(0,0,0,.5);
}

.main-btn{
margin-top:25px;
padding:18px 50px;
font-size:22px;
border:none;
border-radius:50px;
background:#22c55e;
color:white;
cursor:pointer;
transition:.3s;
box-shadow:0 0 20px #22c55e;
}

.main-btn:hover{
transform:scale(1.05);
box-shadow:0 0 40px #22c55e;
}

.channels{
margin-top:70px;
}

.card{
background:rgba(255,255,255,0.06);
margin:20px auto;
padding:25px;
width:85%;
max-width:600px;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.12);
}

a{
color:white;
text-decoration:none;
font-size:20px;
}

.float{
position:fixed;
bottom:25px;
right:25px;
background:#22c55e;
padding:18px 28px;
border-radius:50px;
font-size:18px;
box-shadow:0 0 25px #22c55e;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

</style>
</head>

<body>

<header>

<h1>🕌 منبر الحوزة</h1>
<div class="subtitle">
منصة الحوار العقدي المباشر بالحجة والدليل
</div>

<div class="ayah">
﴿ ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ
وَالْمَوْعِظَةِ الْحَسَنَةِ
وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ ﴾
</div>

<div class="glass">

<a href="https://chatgpt.com/g/g-6999268a6e788191ba73e2adbb8435a8-nqd-qyd-lshy-lthn-shry" target="_blank">
<button class="main-btn">
🚀 ابدأ الحوار الآن
</button>
</a>

</div>

</header>

<div class="channels">

<h2>📺 قنوات الحوار</h2>

<div class="card">
<a href="https://youtube.com/@menbar_zedan" target="_blank">

</a>
</div>

</a>
</div>

</div>

</div>

💬 حاور الآن
</a>

</body>
</html>
